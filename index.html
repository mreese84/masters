<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masters Style Leaderboard</title>
    <style>
        :root {
            --primary: #107d57;
            --bg: #ffffff;
            --alt-bg: #f7f7f7;
            --text: #3b3939;
            --negative: #c73232;
            --border: #d1d1d1;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 900px;
            text-align: center;
            border-bottom: 4px solid var(--primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .header h1 {
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 10px 0;
            font-size: 2.5rem;
        }

        /* Controls Section */
        .controls {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-container {
            position: relative;
            flex: 2;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
        }

        input { width: 100%; box-sizing: border-box; }

        button {
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        /* Autocomplete suggestions */
        .suggestions {
            position: absolute;
            background: white;
            border: 1px solid var(--border);
            width: 100%;
            z-index: 10;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .suggestion-item {
            padding: 10px;
            cursor: pointer;
        }

        .suggestion-item:hover { background-color: var(--alt-bg); }

        /* Leaderboard Table */
        .leaderboard-container {
            width: 100%;
            max-width: 900px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background-color: var(--primary);
            color: white;
        }

        th {
            text-transform: uppercase;
            padding: 15px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            text-align: center;
            font-weight: 500;
        }

        tr:nth-child(even) { background-color: var(--alt-bg); }

        .player-cell { text-align: left; font-weight: 700; }
        
        .flag-img {
            width: 24px;
            height: auto;
            border: 1px solid #eee;
            vertical-align: middle;
        }

        .score-neg { color: var(--negative); font-weight: 800; }
        .score-pos { color: var(--text); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Leaders</h1>
    </div>

    <div class="controls">
        <div class="search-container">
            <input type="text" id="playerSearch" placeholder="Search Athlete..." autocomplete="off">
            <div id="suggestions" class="suggestions hidden"></div>
        </div>
        
        <select id="countryFilter">
            <option value="">All Countries</option>
        </select>

        <button id="clearFilters">Clear Filters</button>
    </div>

    <div class="leaderboard-container">
        <table id="leaderboard">
            <thead>
                <tr>
                    <th>Pos</th>
                    <th style="text-align: left;">Player</th>
                    <th>Country</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard/401811941';
        let allAthletes = [];
        let filteredAthletes = [];

        const searchInput = document.getElementById('playerSearch');
        const suggestionsBox = document.getElementById('suggestions');
        const countryFilter = document.getElementById('countryFilter');
        const leaderboardBody = document.getElementById('leaderboardBody');
        const clearBtn = document.getElementById('clearFilters');

        async function init() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Parse athletes from ESPN structure
                // Note: ESPN data usually sits in competitions[0].competitors
                const competitors = data.events[0].competitions[0].competitors;
                
                allAthletes = competitors.map(comp => {
                    const scoreVal = comp.score?.displayValue || "E";
                    return {
                        id: comp.id,
                        name: comp.athlete.displayName,
                        country: comp.athlete.flag, // PNG URL usually provided here
                        countryName: comp.athlete.birthPlace || "Unknown",
                        scoreStr: scoreVal,
                        scoreInt: scoreVal === "E" ? 0 : parseInt(scoreVal),
                        flag: comp.athlete.flag
                    };
                });

                // Sort by score initially
                allAthletes.sort((a, b) => a.scoreInt - b.scoreInt);
                
                populateCountryFilter();
                renderTable(allAthletes);
            } catch (error) {
                console.error("Error fetching data:", error);
                leaderboardBody.innerHTML = `<tr><td colspan="4">Error loading data. Tournament ID may be inactive.</td></tr>`;
            }
        }

        function renderTable(data) {
            leaderboardBody.innerHTML = '';
            
            // Calculate Ranks (Standard Competition Ranking)
            let currentRank = 1;
            data.forEach((athlete, index) => {
                if (index > 0 && athlete.scoreInt > data[index - 1].scoreInt) {
                    currentRank = index + 1;
                }

                const scoreClass = athlete.scoreInt < 0 ? 'score-neg' : 'score-pos';
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${athlete.scoreInt === 0 && athlete.scoreStr !== "E" ? '-' : currentRank}</td>
                    <td class="player-cell">${athlete.name.toUpperCase()}</td>
                    <td><img src="${athlete.flag}" class="flag-img" alt="flag"></td>
                    <td class="${scoreClass}">${athlete.scoreStr}</td>
                `;
                leaderboardBody.appendChild(row);
            });
        }

        function populateCountryFilter() {
            const countries = [...new Set(allAthletes.map(a => a.countryName))].sort();
            countries.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                countryFilter.appendChild(opt);
            });
        }

        // Search & Autocomplete logic
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            if (!val) {
                suggestionsBox.classList.add('hidden');
                return;
            }

            const matches = allAthletes.filter(a => a.name.toLowerCase().includes(val));
            suggestionsBox.innerHTML = '';
            
            if (matches.length > 0) {
                suggestionsBox.classList.remove('hidden');
                matches.slice(0, 5).forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.textContent = m.name;
                    div.onclick = () => {
                        searchInput.value = m.name;
                        suggestionsBox.classList.add('hidden');
                        renderTable([m]);
                    };
                    suggestionsBox.appendChild(div);
                });
            } else {
                suggestionsBox.classList.add('hidden');
            }
        });

        countryFilter.addEventListener('change', (e) => {
            const val = e.target.value;
            if (!val) {
                renderTable(allAthletes);
            } else {
                const filtered = allAthletes.filter(a => a.countryName === val);
                renderTable(filtered);
            }
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            countryFilter.value = '';
            suggestionsBox.classList.add('hidden');
            renderTable(allAthletes);
        });

        // Close suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                suggestionsBox.classList.add('hidden');
            }
        });

        init();
    </script>
</body>
</html>
