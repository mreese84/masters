<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Masters Tournament — Leaderboard</title>
    <style>
        :root {
            --primary: #107d57;
            --bg: #ffffff;
            --alt-bg: #f7f7f7;
            --text: #3b3939;
            --negative: #c73232;
            --border: #d1d1d1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Georgia", "Times New Roman", serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 60px;
        }

        /* ── Header ── */
        .header {
            width: 100%;
            max-width: 940px;
            text-align: center;
            padding-bottom: 18px;
            margin-bottom: 24px;
            border-bottom: 4px solid var(--primary);
        }

        .header h1 {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--primary);
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .header .subtitle {
            font-size: 0.85rem;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* ── Controls ── */
        .controls {
            width: 100%;
            max-width: 940px;
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: stretch;
        }

        .search-wrapper {
            position: relative;
            flex: 2;
            min-width: 260px;
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-wrapper input:focus {
            border-color: var(--primary);
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 260px;
            overflow-y: auto;
            z-index: 200;
            box-shadow: 0 6px 16px rgba(0,0,0,0.10);
            display: none;
        }

        .suggestions.open { display: block; }

        .suggestion-item {
            padding: 10px 14px;
            cursor: pointer;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.9rem;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
        }

        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover,
        .suggestion-item.active {
            background: var(--alt-bg);
            color: var(--primary);
        }

        select {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--text);
            background: #fff;
            min-width: 180px;
            cursor: pointer;
            outline: none;
        }

        select:focus { border-color: var(--primary); }

        .btn-clear {
            padding: 12px 28px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-clear:hover { background: #0b5e40; }

        /* ── Leaderboard table ── */
        .leaderboard {
            width: 100%;
            max-width: 940px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--primary);
            color: #fff;
        }

        thead th {
            padding: 14px 16px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .leaderboard thead th:nth-child(1) { text-align: center; width: 10%; }
        .leaderboard thead th:nth-child(2) { text-align: left; width: 50%; }
        .leaderboard thead th:nth-child(3) { text-align: center; width: 20%; }
        .leaderboard thead th:nth-child(4) { text-align: center; width: 20%; }

        tbody tr { transition: background 0.15s; }
        tbody tr:nth-child(even) { background: var(--alt-bg); }
        tbody tr:hover { background: #eaf5f0; }

        td {
            padding: 13px 16px;
            border-bottom: 1px solid #eee;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.92rem;
        }

        .leaderboard td:nth-child(1) {
            text-align: center;
            font-weight: 700;
            color: var(--primary);
        }

        .leaderboard td:nth-child(2) {
            text-align: left;
            font-weight: 700;
            color: #1a1a1a;
        }

        .leaderboard td:nth-child(3) { text-align: center; }
        .leaderboard td:nth-child(4) {
            text-align: center;
            font-weight: 700;
        }

        .flag {
            width: 28px;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 2px;
            vertical-align: middle;
        }

        .score-neg { color: var(--negative); font-weight: 800; }

        .divider td {
            background: #e8e8e8;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            padding: 10px 16px;
        }

        .no-results td {
            text-align: center;
            padding: 30px;
            color: #999;
            font-style: italic;
        }

        .loading td {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        /* ── Clickable player names ── */
        td.player-name {
            cursor: pointer;
            transition: color 0.2s;
        }
        td.player-name:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* ── Scorecard view ── */
        .scorecard-view {
            width: 100%;
            max-width: 940px;
            display: none;
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 22px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-back:hover { background: #0b5e40; }

        .scorecard-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .scorecard-header h2 {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 1.5rem;
            color: var(--text);
        }

        .scorecard-header .score-badge {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 4px;
            background: var(--primary);
            color: #fff;
        }

        .round-label {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin: 20px 0 8px;
        }

        .scorecard-table {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }

        .scorecard-table table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .scorecard-table th,
        .scorecard-table td {
            padding: 8px 2px;
            text-align: center;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.78rem;
            border: 1px solid #eee;
            overflow: hidden;
        }

        .scorecard-table th {
            background: var(--primary);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scorecard-table .par-row td {
            background: #f0f0f0;
            font-weight: 700;
            color: #666;
        }

        .scorecard-table .par-row td:first-child {
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 1px;
        }

        .scorecard-table .score-row td {
            font-weight: 700;
            color: var(--text);
        }

        .scorecard-table .score-row td:first-child {
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .scorecard-table .total-col { background: #f7f7f7; font-weight: 800; }

        /* Score indicators: circles for under par, squares for over par */
        .score-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            font-weight: 700;
            font-size: 0.75rem;
            line-height: 1;
        }

        .score-indicator.birdie {
            border: 2px solid #155724;
            border-radius: 50%;
        }

        .score-indicator.eagle {
            border: 2px solid #004085;
            border-radius: 50%;
            box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #004085;
        }

        .score-indicator.bogey {
            border: 2px solid #856404;
        }

        .score-indicator.double-bogey {
            border: 2px solid #721c24;
            box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #721c24;
        }

        .no-hole-data {
            padding: 20px;
            text-align: center;
            color: #999;
            font-style: italic;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        @media (max-width: 600px) {
            .controls { flex-direction: column; }
            .header h1 { font-size: 1.6rem; letter-spacing: 3px; }
            td, th { padding: 10px 8px; font-size: 0.82rem; }
            .flag { width: 22px; }
            .scorecard-table th,
            .scorecard-table td { padding: 6px 1px; font-size: 0.68rem; }
            .score-indicator { width: 18px; height: 18px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>The Masters</h1>
        <div class="subtitle" id="tournamentStatus">Leaderboard</div>
    </div>

    <div class="controls">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Search for an athlete…" autocomplete="off">
            <div class="suggestions" id="suggestions"></div>
        </div>
        <select id="countryFilter">
            <option value="">All Countries</option>
        </select>
        <button class="btn-clear" id="clearBtn">Clear Filters</button>
    </div>

    <div class="leaderboard">
        <table>
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Player</th>
                    <th>Country</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr class="loading"><td colspan="4">Loading leaderboard…</td></tr>
            </tbody>
        </table>
    </div>

    <div class="scorecard-view" id="scorecardView">
        <button class="btn-back" id="backToLeaderboard">← Back to Leaderboard</button>
        <div id="scorecardContent"></div>
    </div>

    <script>
    (function () {
        const API_URL = 'https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard/401811941';

        let allAthletes = [];
        let activeSearch = null;   // currently‑selected athlete from search
        let activeCountry = '';    // currently‑selected country

        // ── DOM refs ──
        const tbody          = document.getElementById('tbody');
        const searchInput    = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');
        const countryFilter  = document.getElementById('countryFilter');
        const clearBtn       = document.getElementById('clearBtn');
        const statusEl       = document.getElementById('tournamentStatus');

        // ── Parse helpers ──
        function parseScore(raw) {
            if (raw === 'E' || raw === 'Even') return 0;
            const n = parseInt(raw, 10);
            return isNaN(n) ? 0 : n;
        }

        function findCompetitors(obj, results) {
            if (!obj || typeof obj !== 'object') return results;
            if (obj.athlete && (obj.athlete.fullName || obj.athlete.displayName)) {
                results.push(obj);
            }
            for (const key in obj) {
                if (Object.prototype.hasOwnProperty.call(obj, key)) {
                    findCompetitors(obj[key], results);
                }
            }
            return results;
        }

        // ── Fetch & process ──
        function load() {
            // Use JSONP for cross‑origin compatibility
            const cbName = '_espnCB_' + Date.now();
            window[cbName] = function (data) {
                delete window[cbName];
                document.body.removeChild(script);
                processData(data);
            };
            const script = document.createElement('script');
            script.src = API_URL + '?callback=' + cbName;
            script.onerror = function () {
                tbody.innerHTML = '<tr class="no-results"><td colspan="4">Failed to load data from ESPN.</td></tr>';
            };
            document.body.appendChild(script);
        }

        function processData(data) {
            try {
                // Extract tournament status
                const status = data?.status?.type?.shortDetail || data?.competitions?.[0]?.status?.type?.shortDetail || '';
                if (status) statusEl.textContent = status;

                const raw = findCompetitors(data, []);
                if (!raw.length) throw new Error('No competitors found');

                const unique = new Map();
                raw.forEach(function (c) {
                    const a = c.athlete;
                    const name = a.fullName || a.displayName;
                    if (unique.has(name)) return;

                    const scoreRaw = c.score;
                    const started = scoreRaw !== null && scoreRaw !== undefined && scoreRaw !== '';
                    // Determine if actually on course — check if linescore value > 0
                    const lsVal = c.linescores && c.linescores[0] && c.linescores[0].value;
                    const onCourse = started && lsVal !== undefined && lsVal > 0;

                    unique.set(name, {
                        name: name,
                        flagUrl: a.flag ? a.flag.href : '',
                        country: a.flag ? a.flag.alt : '',
                        scoreDisplay: started ? scoreRaw : 'E',
                        scoreNum: parseScore(started ? scoreRaw : 'E'),
                        onCourse: onCourse,
                        linescores: c.linescores || []
                    });
                });

                allAthletes = Array.from(unique.values());
                fillCountryDropdown();
                render();
            } catch (e) {
                tbody.innerHTML = '<tr class="no-results"><td colspan="4">Error: ' + e.message + '</td></tr>';
            }
        }

        // ── Rendering ──
        function render() {
            let list = allAthletes;

            // Apply country filter
            if (activeCountry) {
                list = list.filter(function (a) { return a.country === activeCountry; });
            }
            // Apply search filter (single athlete)
            if (activeSearch) {
                list = list.filter(function (a) { return a.name === activeSearch; });
            }

            // Separate started / not started
            const started = list.filter(function (a) { return a.onCourse; })
                                .sort(function (a, b) { return a.scoreNum - b.scoreNum; });
            const notStarted = list.filter(function (a) { return !a.onCourse; })
                                   .sort(function (a, b) { return a.name.localeCompare(b.name); });

            tbody.innerHTML = '';

            if (started.length === 0 && notStarted.length === 0) {
                tbody.innerHTML = '<tr class="no-results"><td colspan="4">No athletes match the current filters.</td></tr>';
                return;
            }

            // Assign positions with ties for started athletes
            var positions = [];
            if (started.length) {
                var rank = 1;
                positions.push(rank);
                for (var i = 1; i < started.length; i++) {
                    if (started[i].scoreNum !== started[i - 1].scoreNum) {
                        rank = i + 1;
                    }
                    positions.push(rank);
                }
            }

            started.forEach(function (a, i) {
                tbody.appendChild(buildRow(a, positions[i]));
            });

            if (notStarted.length) {
                var div = document.createElement('tr');
                div.className = 'divider';
                div.innerHTML = '<td colspan="4">Yet to Tee Off</td>';
                tbody.appendChild(div);

                // If the only athletes we're showing are in the not-started group,
                // rank them all as T1 (all at E / 0).
                var nsRank = started.length ? started.length + 1 : 1;
                notStarted.forEach(function (a) {
                    tbody.appendChild(buildRow(a, nsRank));
                });
            }
        }

        function buildRow(a, pos) {
            var tr = document.createElement('tr');
            var isNeg = a.scoreNum < 0;
            var scoreClass = isNeg ? ' class="score-neg"' : '';

            tr.innerHTML =
                '<td>' + (pos !== undefined ? pos : '-') + '</td>' +
                '<td class="player-name">' + escapeHtml(a.name) + '</td>' +
                '<td><img src="' + escapeHtml(a.flagUrl) + '" class="flag" alt="' + escapeHtml(a.country) + '" onerror="this.style.display=\'none\'"></td>' +
                '<td' + scoreClass + '>' + escapeHtml(a.scoreDisplay) + '</td>';

            tr.querySelector('.player-name').addEventListener('click', function() {
                showScorecard(a.name);
            });

            return tr;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ── Country dropdown ──
        function fillCountryDropdown() {
            var countries = [];
            var seen = {};
            allAthletes.forEach(function (a) {
                if (a.country && !seen[a.country]) {
                    seen[a.country] = true;
                    countries.push(a.country);
                }
            });
            countries.sort();
            countryFilter.innerHTML = '<option value="">All Countries</option>';
            countries.forEach(function (c) {
                var opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                countryFilter.appendChild(opt);
            });
        }

        // ── Search + autocomplete ──
        var highlightIdx = -1;

        searchInput.addEventListener('input', function () {
            var q = searchInput.value.trim().toLowerCase();
            highlightIdx = -1;

            if (!q) {
                closeSuggestions();
                activeSearch = null;
                render();
                return;
            }

            var matches = allAthletes.filter(function (a) {
                return a.name.toLowerCase().indexOf(q) !== -1;
            });

            if (!matches.length) {
                closeSuggestions();
                return;
            }

            suggestionsBox.innerHTML = '';
            matches.slice(0, 10).forEach(function (m, idx) {
                var div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = m.name;
                div.setAttribute('data-idx', idx);
                div.addEventListener('mousedown', function (e) {
                    e.preventDefault();          // keep focus in input
                    selectAthlete(m.name);
                });
                suggestionsBox.appendChild(div);
            });
            suggestionsBox.classList.add('open');
        });

        searchInput.addEventListener('keydown', function (e) {
            var items = suggestionsBox.querySelectorAll('.suggestion-item');
            if (!items.length) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                highlightIdx = Math.min(highlightIdx + 1, items.length - 1);
                updateHighlight(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                highlightIdx = Math.max(highlightIdx - 1, 0);
                updateHighlight(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (highlightIdx >= 0 && highlightIdx < items.length) {
                    selectAthlete(items[highlightIdx].textContent);
                }
            } else if (e.key === 'Escape') {
                closeSuggestions();
            }
        });

        searchInput.addEventListener('blur', function () {
            // Small delay so click on suggestion registers first
            setTimeout(closeSuggestions, 150);
        });

        function updateHighlight(items) {
            items.forEach(function (el, i) {
                el.classList.toggle('active', i === highlightIdx);
            });
        }

        function selectAthlete(name) {
            searchInput.value = name;
            activeSearch = name;
            closeSuggestions();
            render();
        }

        function closeSuggestions() {
            suggestionsBox.classList.remove('open');
            suggestionsBox.innerHTML = '';
            highlightIdx = -1;
        }

        // ── Country filter ──
        countryFilter.addEventListener('change', function () {
            activeCountry = countryFilter.value;
            render();
        });

        // ── Clear filters ──
        clearBtn.addEventListener('click', function () {
            searchInput.value = '';
            countryFilter.value = '';
            activeSearch = null;
            activeCountry = '';
            render();
        });

        // ── Augusta National par values ──
        var augustaPars = [4, 5, 4, 3, 4, 3, 4, 5, 4, 4, 4, 3, 5, 4, 5, 3, 4, 4];

        // ── Compute field averages per round per hole ──
        function computeFieldAverages() {
            // Returns array of rounds, each round is an array of 18 { sum, count, avg }
            var maxRounds = 0;
            allAthletes.forEach(function(a) {
                if (a.linescores && a.linescores.length > maxRounds) maxRounds = a.linescores.length;
            });
            var avgs = [];
            for (var r = 0; r < maxRounds; r++) {
                var roundAvgs = [];
                for (var h = 0; h < 18; h++) {
                    roundAvgs.push({ sum: 0, count: 0, avg: 0 });
                }
                allAthletes.forEach(function(a) {
                    if (!a.linescores || !a.linescores[r]) return;
                    var holes = a.linescores[r].linescores || [];
                    for (var h = 0; h < Math.min(holes.length, 18); h++) {
                        if (!holes[h]) continue;
                        var val = holes[h].value !== undefined ? holes[h].value : parseInt(holes[h].displayValue, 10);
                        if (!isNaN(val) && val > 0) {
                            roundAvgs[h].sum += val;
                            roundAvgs[h].count++;
                        }
                    }
                });
                roundAvgs.forEach(function(ha) {
                    ha.avg = ha.count > 0 ? (ha.sum / ha.count) : 0;
                });
                avgs.push(roundAvgs);
            }
            return avgs;
        }

        // ── Scorecard view ──
        function showScorecard(name) {
            var athlete = allAthletes.find(function(a) { return a.name === name; });
            if (!athlete) return;

            document.querySelector('.controls').style.display = 'none';
            document.querySelector('.leaderboard').style.display = 'none';
            var scorecardView = document.getElementById('scorecardView');
            scorecardView.style.display = 'block';

            var content = document.getElementById('scorecardContent');
            var html = '';

            // Player header
            html += '<div class="scorecard-header">';
            if (athlete.flagUrl) {
                html += '<img src="' + escapeHtml(athlete.flagUrl) + '" class="flag" alt="' + escapeHtml(athlete.country) + '">';
            }
            html += '<h2>' + escapeHtml(athlete.name) + '</h2>';
            html += '<span class="score-badge">' + escapeHtml(athlete.scoreDisplay) + '</span>';
            html += '</div>';

            var rounds = athlete.linescores;
            if (!rounds || !rounds.length) {
                html += '<div class="no-hole-data">No scoring data available for this player.</div>';
                content.innerHTML = html;
                return;
            }

            var fieldAvgs = computeFieldAverages();

            rounds.forEach(function(round, rIdx) {
                var holes = round.linescores || [];
                var roundScore = round.displayValue || round.value || '';
                var roundAvgs = fieldAvgs[rIdx] || [];

                html += '<div class="round-label">Round ' + (rIdx + 1);
                if (roundScore) html += ' &mdash; ' + roundScore;
                html += '</div>';

                if (!holes.length) {
                    html += '<div class="no-hole-data">Hole-by-hole data not available for this round.</div>';
                    return;
                }

                // Front 9
                html += buildNineHoles(holes, 0, 9, augustaPars, 'OUT', rIdx, roundAvgs);

                // Back 9
                if (holes.length > 9) {
                    html += buildNineHoles(holes, 9, Math.min(holes.length, 18), augustaPars, 'IN', rIdx, roundAvgs);
                }
            });

            content.innerHTML = html;
        }

        function buildNineHoles(holes, start, end, pars, label, roundIdx, roundAvgs) {
            var html = '<div class="scorecard-table"><table>';

            // Header row (hole numbers)
            html += '<thead><tr><th>Hole</th>';
            for (var i = start; i < end; i++) {
                html += '<th>' + (i + 1) + '</th>';
            }
            html += '<th>' + label + '</th>';
            html += '</tr></thead><tbody>';

            // Par row
            html += '<tr class="par-row"><td>Par</td>';
            var parTotal = 0;
            for (var i = start; i < end; i++) {
                var p = pars[i] || 4;
                parTotal += p;
                html += '<td>' + p + '</td>';
            }
            html += '<td class="total-col">' + parTotal + '</td>';
            html += '</tr>';

            // Score row
            html += '<tr class="score-row"><td>R' + (roundIdx + 1) + '</td>';
            var scoreTotal = 0;
            var hasScores = false;
            for (var i = start; i < end; i++) {
                var avgInfo = roundAvgs && roundAvgs[i] ? roundAvgs[i] : null;
                var tooltip = '';
                if (avgInfo && avgInfo.count > 0) {
                    tooltip = ' title="Field avg: ' + avgInfo.avg.toFixed(2) + '"';
                }
                if (i < holes.length && holes[i]) {
                    var val = holes[i].value !== undefined ? holes[i].value : parseInt(holes[i].displayValue, 10);
                    if (isNaN(val)) val = 0;
                    if (val > 0) {
                        hasScores = true;
                        scoreTotal += val;
                        var par = pars[i] || 4;
                        var cls = '';
                        if (val <= par - 2) cls = 'eagle';
                        else if (val === par - 1) cls = 'birdie';
                        else if (val === par + 1) cls = 'bogey';
                        else if (val >= par + 2) cls = 'double-bogey';
                        if (cls) {
                            html += '<td' + tooltip + '><span class="score-indicator ' + cls + '">' + val + '</span></td>';
                        } else {
                            html += '<td' + tooltip + '>' + val + '</td>';
                        }
                    } else {
                        html += '<td' + tooltip + '></td>';
                    }
                } else {
                    html += '<td' + tooltip + '></td>';
                }
            }
            html += '<td class="total-col">' + (hasScores ? scoreTotal : '') + '</td>';
            html += '</tr>';

            html += '</tbody></table></div>';
            return html;
        }

        function showLeaderboard() {
            document.querySelector('.controls').style.display = 'flex';
            document.querySelector('.leaderboard').style.display = 'block';
            document.getElementById('scorecardView').style.display = 'none';
        }

        document.getElementById('backToLeaderboard').addEventListener('click', showLeaderboard);

        // ── Kick off ──
        load();
    })();
    </script>
</body>
</html>
